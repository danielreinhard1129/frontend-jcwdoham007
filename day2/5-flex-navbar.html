<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar Flex</title>
    <style>
      .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #0f6969;
        color: white;
      }

      .nav-items {
        display: flex;
        gap: 30px;
      }

      .nav-btn {
        background-color: white;
        color: #0f6969;
        border: none;
        padding-left: 20px;
        padding-right: 20px;
        padding-top: 10px;
        padding-bottom: 10px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>BWC</h1>

      <div class="nav-items">
        <p>HOME</p>
        <p>ABOUT</p>
        <p>SERVICES</p>
      </div>

      <button class="nav-btn">Contact</button>
    </div>
  </body>
</html>
