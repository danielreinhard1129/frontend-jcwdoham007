<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin & Padding</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      .konten {
        border: 1px solid black;
        width: 400px;
        height: 200px;
        padding: 10px;
        margin-left: 20px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="konten">Konten</div>
  </body>
</html>
